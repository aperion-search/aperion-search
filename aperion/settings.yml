general:
  # Debug mode, only for development. Is overwritten by ${aperion_DEBUG}
  debug: false
  # displayed name
  instance_name: "Aperion Search"
  # For example: https://example.com/privacy
  privacypolicy_url: false
  # use true to use your own donation page written in aperion/info/en/donate.md
  # use false to disable the donation link
  donation_url: false
  # mailto:contact@example.com
  contact_url: false
  # record stats
  enable_metrics: true
  # expose stats in open metrics format at /metrics
  # leave empty to disable (no password set)
  # open_metrics: <password>
  open_metrics: ''

brand:
  new_issue_url: https://github.com/Aperion-Search/Aperion-Search/issues/new
  docs_url: https://docs-aperion-search.onrender.com/
  wiki_url: https://github.com/aperion/aperion/wiki
  issue_url: https://github.com/Aperion-Search/Aperion-Search/issues/
  # custom:
  #   maintainer: "Jon Doe"
  #   # Custom entries in the footer: [title]: [link]
  #   links:
  #     Uptime: https://uptime.aperion.org/history/darmarit-org
  #     About: "https://aperion.org"

search:
  # Filter results. 0: None, 1: Moderate, 2: Strict
  safe_search: 0
  # Existing autocomplete backends: "360search", "baidu", "brave", "dbpedia", "duckduckgo", "google", "yandex",
  # "mwmbl", "naver", "seznam", "sogou", "startpage", "stract", "swisscows", "quark", "qwant", "wikipedia" -
  # leave blank to turn it off by default.
  autocomplete: "duckduckgo"
  # minimun characters to type before autocompleter starts
  autocomplete_min: 4
  # backend for the favicon near URL in search results.
  # Available resolvers: "allesedv", "duckduckgo", "google", "yandex" - leave blank to turn it off by default.
  favicon_resolver: ""
  # Default search language - leave blank to detect from browser information or
  # use codes from 'languages.py'
  default_lang: "auto"
  # max_page: 0  # if engine supports paging, 0 means unlimited numbers of pages
  # Available languages
  # languages:
  #   - all
  #   - en
  #   - en-US
  #   - de
  #   - it-IT
  #   - fr
  #   - fr-BE
  # ban time in seconds after engine errors
  ban_time_on_fail: 5
  # max ban time in seconds after engine errors
  max_ban_time_on_fail: 120
  suspended_times:
    # Engine suspension time after error (in seconds; set to 0 to disable)
    # For error "Access denied" and "HTTP error [402, 403]"
    AperionEngineAccessDenied: 86400
    # For error "CAPTCHA"
    AperionEngineCaptcha: 86400
    # For error "Too many request" and "HTTP error 429"
    AperionEngineTooManyRequests: 3600
    # Cloudflare CAPTCHA
    cf_AperionEngineCaptcha: 1296000
    cf_AperionEngineAccessDenied: 86400
    # ReCAPTCHA
    recaptcha_AperionEngineCaptcha: 604800

  # remove format to deny access, use lower case.
  # formats: [html, csv, json, rss]
  formats:
    - html

server:
  # Is overwritten by ${aperion_PORT} and ${aperion_BIND_ADDRESS}
  port: 8888
  bind_address: "0.0.0.0"
  # public URL of the instance, to ensure correct inbound links. Is overwritten
  # by ${aperion_BASE_URL}.
  base_url: false  # "http://example.com/location"
  # rate limit the number of request on the instance, block some bots.
  # Is overwritten by ${aperion_LIMITER}
  limiter: false
  # enable features designed only for public instances.
  # Is overwritten by ${aperion_PUBLIC_INSTANCE}
  public_instance: false

  # If your instance owns a /etc/aperion/settings.yml file, then set the following
  # values there.

  secret_key: "f267fe000cb84c4a089d7212773fa82a9a01e56dd8f70f533588d982cccd6445"  # Is overwritten by ${aperion_SECRET}
  # Proxy image results through aperion. Is overwritten by ${aperion_IMAGE_PROXY}
  image_proxy: false
  # 1.0 and 1.1 are supported
  http_protocol_version: "1.0"
  # POST queries are more secure as they don't show up in history but may cause
  # problems when using Firefox containers.
  # Is overwritten by ${aperion_METHOD}
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  # URL to connect valkey database. Is overwritten by ${aperion_VALKEY_URL}.
  # https://docs.aperion.org/admin/settings/settings_valkey.html#settings-valkey
  # url: valkey://localhost:6379/0
  url: false

ui:
  # Custom static path - leave it blank if you didn't change
  static_path: ""
  # Custom templates path - leave it blank if you didn't change
  templates_path: ""
  # query_in_title: When true, the result page's titles contains the query
  # it decreases the privacy, since the browser can records the page titles.
  query_in_title: false
  # infinite_scroll: When true, automatically loads the next page when scrolling to bottom of the current page.
  infinite_scroll: false
  # ui theme
  default_theme: simple
  # center the results ?
  center_alignment: false
  # URL prefix of the internet archive, don't forget trailing slash (if needed).
  # cache_url: "https://webcache.googleusercontent.com/search?q=cache:"
  # Default interface locale - leave blank to detect from browser information or
  # use codes from the 'locales' config section
  default_locale: ""
  # Open result links in a new tab by default
  # results_on_new_tab: false
  theme_args:
    # style of simple theme: auto, light, dark
    simple_style: auto
  # Perform search immediately if a category selected.
  # Disable to select multiple categories at once and start the search manually.
  search_on_category_select: true
  # Hotkeys: default or vim
  hotkeys: default
  # URL formatting: pretty, full or host
  url_formatting: pretty
  # AI Summarization settings
  # These can be locked by administrators to prevent user changes
  # ai_summarization_enabled: false
  # ai_api_endpoint: ""
  # ai_api_key: ""
  # ai_model: ""
  # ai_num_results: "5"
  # ai_timeout_per_result: "5"
  # ai_max_tokens: "500"
  # ai_system_prompt: ""

# Lock arbitrary settings on the preferences page.
#
# preferences:
#   lock:
#     - categories
#     - language
#     - autocomplete
#     - favicon
#     - safesearch
#     - method
#     - doi_resolver
#     - locale
#     - theme
#     - results_on_new_tab
#     - infinite_scroll
#     - search_on_category_select
#     - method
#     - image_proxy
#     - query_in_title

# communication with search engines
#

botdetection:
  enabled: false
  trusted_proxies: []

outgoing:
  # default timeout in seconds, can be override by engine
  request_timeout: 10.0
  # the maximum timeout in seconds
  # max_request_timeout: 10.0
  # suffix of aperion_useragent, could contain information like an email address
  # to the administrator
  useragent_suffix: ""
  # The maximum number of concurrent connections that may be established.
  pool_connections: 100
  # Allow the connection pool to maintain keep-alive connections below this
  # point.
  pool_maxsize: 20
  # See https://www.python-httpx.org/http2/
  enable_http2: true
  # uncomment below section if you want to use a custom server certificate
  # see https://www.python-httpx.org/advanced/#changing-the-verification-defaults
  # and https://www.python-httpx.org/compatibility/#ssl-configuration
  #  verify: ~/.mitmproxy/mitmproxy-ca-cert.cer
  #
  # uncomment below section if you want to use a proxyq see: SOCKS proxies
  #   https://2.python-requests.org/en/latest/user/advanced/#proxies
  # are also supported: see
  #   https://2.python-requests.org/en/latest/user/advanced/#socks
  #
  #  proxies:
  #    all://:
  #      - http://proxy1:8080
  #      - http://proxy2:8080
  #
  #  using_tor_proxy: true
  #
  # Extra seconds to add in order to account for the time taken by the proxy
  #
  #  extra_proxy_timeout: 10
  #
  # uncomment below section only if you have more than one network interface
  # which can be the source of outgoing search requests
  #
  #  source_ips:
  #    - 1.1.1.1
  #    - 1.1.1.2
  #    - fe80::/126

# Plugin configuration, for more details see
#   https://docs.aperion.org/admin/settings/settings_plugins.html
#
plugins:

  aperion.plugins.calculator.SXNGPlugin:
    active: true

  aperion.plugins.hash_plugin.SXNGPlugin:
    active: true

  aperion.plugins.self_info.SXNGPlugin:
    active: true

  aperion.plugins.unit_converter.SXNGPlugin:
    active: true

  aperion.plugins.ahmia_filter.SXNGPlugin:
    active: true

  aperion.plugins.hostnames.SXNGPlugin:
    active: true

  aperion.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false

  aperion.plugins.tor_check.SXNGPlugin:
    active: false

  aperion.plugins.tracker_url_remover.SXNGPlugin:
    active: true


# Configuration of the "Hostnames plugin":
#
# hostnames:
#   replace:
#     '(.*\.)?youtube\.com$': 'yt.example.com'
#     '(.*\.)?youtu\.be$': 'yt.example.com'
#     '(.*\.)?reddit\.com$': 'teddit.example.com'
#     '(.*\.)?redd\.it$': 'teddit.example.com'
#     '(www\.)?twitter\.com$': 'nitter.example.com'
#   remove:
#     - '(.*\.)?facebook.com$'
#   low_priority:
#     - '(.*\.)?google(\..*)?$'
#   high_priority:
#     - '(.*\.)?wikipedia.org$'
#
# Alternatively you can use external files for configuring the "Hostnames plugin":
#
# hostnames:
#  replace: 'rewrite-hosts.yml'
#
# Content of 'rewrite-hosts.yml' (place the file in the same directory as 'settings.yml'):
# '(.*\.)?youtube\.com$': 'yt.example.com'
# '(.*\.)?youtu\.be$': 'yt.example.com'
#

checker:
  # disable checker when in debug mode
  off_when_debug: true

  # use "scheduling: {}" to disable scheduling
  # scheduling: interval or int

  # to activate the scheduler:
  # * uncomment "scheduling" section
  # * add "cache2 = name=aperioncache,items=2000,blocks=2000,blocksize=4096,bitmap=1"
  #   to your uwsgi.ini

  # scheduling:
  #   start_after: [300, 1800]  # delay to start the first run of the checker
  #   every: [86400, 90000]     # how often the checker runs

  # additional tests: only for the YAML anchors (see the engines section)
  #
  additional_tests:
    rosebud: &test_rosebud
      matrix:
        query: rosebud
        lang: en
      result_container:
        - not_empty
        - ['one_title_contains', 'citizen kane']
      test:
        - unique_results

    android: &test_android
      matrix:
        query: ['android']
        lang: ['en', 'de', 'fr', 'zh-CN']
      result_container:
        - not_empty
        - ['one_title_contains', 'google']
      test:
        - unique_results

  # tests: only for the YAML anchors (see the engines section)
  tests:
    infobox: &tests_infobox
      infobox:
        matrix:
          query: ["linux", "new york", "bbc"]
        result_container:
          - has_infobox

categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

engines:
  # ========================================
  # FAST & PRIVACY-FRIENDLY SEARCH ENGINES
  # ========================================

  # Primary Web Search - DuckDuckGo (fast, no redirects, privacy-focused)
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    timeout: 3.0
    weight: 10

  # Images - DuckDuckGo
  - name: duckduckgo images
    engine: duckduckgo_extra
    categories: [images, web]
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 3.0
    weight: 10

  # Videos - DuckDuckGo
  - name: duckduckgo videos
    engine: duckduckgo_extra
    categories: [videos, web]
    ddg_category: videos
    shortcut: ddv
    disabled: false
    timeout: 3.0
    weight: 10

  # News - DuckDuckGo
  - name: duckduckgo news
    engine: duckduckgo_extra
    categories: [news, web]
    ddg_category: news
    shortcut: ddn
    disabled: false
    timeout: 3.0
    weight: 10

  # Weather - DuckDuckGo
  - name: duckduckgo weather
    engine: duckduckgo_weather
    shortcut: ddw
    disabled: false
    timeout: 3.0

  # Definitions - DuckDuckGo
  - name: ddg definitions
    engine: duckduckgo_definitions
    shortcut: ddd
    weight: 2
    disabled: false
    timeout: 3.0

  # Wikipedia - Fast, direct results, no redirects
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    timeout: 3.0
    weight: 3
    display_type: ["infobox"]
    categories: [general]

  # Wikidata - Structured data, fast
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false
    timeout: 3.0
    weight: 2
    display_type: ["infobox"]
    categories: [general]

  # ArXiv - Academic papers, direct access
  - name: arxiv
    engine: arxiv
    shortcut: arx
    timeout: 3.0
    weight: 5
    disabled: false

  # GitHub - Code search, no redirects
  - name: github
    engine: github
    shortcut: gh
    disabled: false
    timeout: 5.0
    weight: 5

  # GitLab - Code search alternative
  - name: gitlab
    engine: gitlab
    base_url: https://gitlab.com
    shortcut: gl
    disabled: false
    timeout: 5.0
    weight: 5

  # Docker Hub - Container packages
  - name: docker hub
    engine: docker_hub
    shortcut: dh
    categories: [it, packages]
    timeout: 3.0
    disabled: false

  # PyPI - Python packages
  - name: pypi
    engine: xpath
    paging: true
    search_url: https://pypi.org/search/?q={query}&page={pageno}
    url_xpath: //a[@class="package-snippet"]/@href
    title_xpath: //span[@class="package-snippet__name"]
    content_xpath: //p[@class="package-snippet__description"]
    categories: [it, packages]
    timeout: 3.0
    disabled: false
    shortcut: py
    about:
      website: https://pypi.org/
      official_api_documentation: https://warehouse.pypa.io/api-reference/
      use_official_api: false
      require_api_key: false
      results: HTML

  # npm - JavaScript packages
  - name: npm
    engine: xpath
    paging: true
    search_url: https://www.npmjs.com/search?q={query}&page={pageno}
    url_xpath: //a[@class="db ae af ag ah ai aj ak al am"]/@href
    title_xpath: //h4[@class="bh"]
    content_xpath: //p[@class="bh bi"]
    categories: [it, packages]
    timeout: 3.0
    disabled: false
    shortcut: npm
    about:
      website: https://www.npmjs.com/
      official_api_documentation: https://github.com/npm/registry/blob/master/docs/REGISTRY-API.md
      use_official_api: false
      require_api_key: false
      results: HTML

  # Crossref - Academic metadata, fast API
  - name: crossref
    engine: crossref
    shortcut: cr
    timeout: 5.0
    disabled: false
    weight: 5

  # CPPReference - C++ documentation, direct access
  - name: cppreference
    engine: cppreference
    shortcut: cpp
    paging: false
    disabled: false
    timeout: 3.0
    categories: [it]

  # Alpine Linux Packages
  - name: alpine linux packages
    engine: alpinelinux
    disabled: false
    shortcut: alp
    timeout: 3.0

  # Arch Linux Wiki
  - name: arch linux wiki
    engine: archlinux
    shortcut: al
    timeout: 3.0
    disabled: false

  # NixOS Wiki
  - name: nixos wiki
    engine: mediawiki
    shortcut: nixw
    base_url: https://wiki.nixos.org/
    search_type: text
    disabled: false
    categories: [it, software wikis]
    timeout: 3.0

  # Free Software Directory
  - name: free software directory
    engine: mediawiki
    shortcut: fsd
    categories: [it, software wikis]
    base_url: https://directory.fsf.org/
    search_type: title
    timeout: 3.0
    disabled: false

  # Gentoo Wiki
  - name: gentoo
    engine: mediawiki
    shortcut: ge
    categories: ["it", "software wikis"]
    base_url: "https://wiki.gentoo.org/"
    api_path: "api.php"
    search_type: text
    timeout: 3.0
    disabled: false

  # Etymology Online - Direct API, no redirects
  - name: etymonline
    engine: xpath
    paging: true
    search_url: https://etymonline.com/search?page={pageno}&q={query}
    url_xpath: //a[contains(@class, "word__name--")]/@href
    title_xpath: //a[contains(@class, "word__name--")]
    content_xpath: //section[contains(@class, "word__defination")]
    first_page_num: 1
    shortcut: et
    categories: [dictionaries]
    timeout: 3.0
    disabled: false

  # Currency Converter
  - name: currency
    engine: currency_convert
    categories: general
    shortcut: cc
    timeout: 3.0
    disabled: false

  # TinyEye - Reverse image search
  - name: tineye
    engine: tineye
    shortcut: tin
    timeout: 3.0
    disabled: false

  # Emojipedia - Fast emoji search
  - name: emojipedia
    engine: emojipedia
    timeout: 3.0
    shortcut: em
    disabled: false

  # F-Droid - Open source Android apps
  - name: fdroid
    engine: fdroid
    shortcut: fd
    disabled: false
    timeout: 3.0

  # APK Mirror - Android packages
  - name: apk mirror
    engine: apkmirror
    timeout: 3.0
    shortcut: apkm
    disabled: false

  # Bandcamp - Music search
  - name: bandcamp
    engine: bandcamp
    shortcut: bc
    categories: music
    timeout: 3.0
    disabled: false

  # Deezer - Music streaming search
  - name: deezer
    engine: deezer
    shortcut: dz
    disabled: false
    timeout: 3.0

  # Alexandria - Academic library, fast JSON API
  - name: alexandria
    engine: json_engine
    shortcut: alx
    categories: general
    paging: true
    search_url: https://api.alexandria.org/?a=1&q={query}&p={pageno}
    results_query: results
    title_query: title
    url_query: url
    content_query: snippet
    timeout: 2.0
    disabled: false
    weight: 3
    about:
      website: https://alexandria.org/
      official_api_documentation: https://github.com/alexandria-org/alexandria-api/raw/master/README.md
      use_official_api: true
      require_api_key: false
      results: JSON

  # Crowdview - Fast meta-search with JSON API
  - name: crowdview
    engine: json_engine
    shortcut: cv
    categories: general
    paging: false
    search_url: https://crowdview-next-js.onrender.com/api/search-v3?query={query}
    results_query: results
    url_query: link
    title_query: title
    content_query: snippet
    title_html_to_text: true
    content_html_to_text: true
    disabled: false
    timeout: 5.0
    weight: 3
    about:
      website: https://crowdview.ai/

  # Yep - Fast search engine alternative
  - name: yep
    engine: yep
    shortcut: yep
    categories: general
    search_type: web
    timeout: 3.0
    disabled: false
    weight: 8

  - name: yep images
    engine: yep
    shortcut: yepi
    categories: images
    search_type: images
    timeout: 3.0
    disabled: false

  - name: yep news
    engine: yep
    shortcut: yepn
    categories: news
    search_type: news
    timeout: 3.0
    disabled: false

  # Bitbucket - Git repository search
  - name: bitbucket
    engine: xpath
    paging: true
    search_url: https://bitbucket.org/repo/all/{pageno}?name={query}
    url_xpath: //article[@class="repo-summary"]//a[@class="repo-link"]/@href
    title_xpath: //article[@class="repo-summary"]//a[@class="repo-link"]
    content_xpath: //article[@class="repo-summary"]/p
    categories: [it, repos]
    timeout: 3.0
    disabled: false
    shortcut: bb
    weight: 5

  # Anaonda/Conda packages
  - name: anaconda
    engine: xpath
    paging: true
    first_page_num: 0
    search_url: https://anaconda.org/search?q={query}&page={pageno}
    results_xpath: //tbody/tr
    url_xpath: ./td/h5/a[last()]/@href
    title_xpath: ./td/h5
    content_xpath: ./td[h5]/text()
    categories: it
    timeout: 3.0
    shortcut: conda
    disabled: false
