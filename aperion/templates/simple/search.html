<form id="search" method="{{ method or 'POST' }}" action="{{ url_for('search') }}" role="search">
  <div id="search_header">
    <a id="search_logo" href="{{ url_for('index') }}" tabindex="0" title="{{ _('Display the front page') }}">
      <span hidden>Aperion Search</span>
      <img src="{{ url_for('static', filename='themes/simple/img/aperion.png') }}?v=2" alt="Aperion Search" style="height: 40px;">
    </a>
    <div id="search_view">
      <div class="search_box">
        <input id="q" name="q" type="text" placeholder="{{ _('Search for...') }}" tabindex="1" autocomplete="off" autocapitalize="none" spellcheck="false" autocorrect="off" dir="auto" value="{{ q or '' }}">
        <button id="clear_search" type="reset" aria-label="{{ _('clear') }}" class="hide_if_nojs"><span>{{ icon_big('close') }}</span><span class="show_if_nojs">{{ _('clear') }}</span></button>
        <button id="ai_mode_toggle" type="button" aria-label="{{ _('AI Mode') }}" class="hide_if_nojs" title="{{ _('Ask AI directly') }}" style="background:none; border:none; padding:4px 8px; margin:0; font-size:20px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;">✨</button>
        <button id="send_search" type="submit" {%- if search_on_category_select -%}name="category_{{ selected_categories[0]|replace(' ', '_') }}"{%- endif -%} aria-label="{{ _('search') }}"><span class="hide_if_nojs">{{ icon_big('search') }}</span><span class="show_if_nojs">{{ _('search') }}</span></button>
        <div class="autocomplete hide_if_nojs"><ul></ul></div>
      </div>
    </div>
    {% set display_tooltip = true %}
    {% include 'simple/categories.html' %}
  </div>
  <div class="search_filters">
    {% include 'simple/filters/languages.html' %}
    {% include 'simple/filters/time_range.html' %}
    {% include 'simple/filters/safesearch.html' %}
  </div>
  <input type="hidden" name="theme" value="{{ theme }}" >
  <input type="hidden" name="ai_mode" id="ai_mode_input" value="{{ 'true' if ai_mode else '' }}" >
  {% if timeout_limit %}<input type="hidden" name="timeout_limit" value="{{ timeout_limit|e }}" >{% endif %}
</form>

<script>
(function() {
  'use strict';
  
  const aiToggle = document.getElementById('ai_mode_toggle');
  const aiTabCheckbox = document.getElementById('ai_mode_tab_checkbox');
  const aiTabButton = document.getElementById('ai_mode_tab_button');
  const aiInput = document.getElementById('ai_mode_input');
  const searchInput = document.getElementById('q');
  
  function navigateToAI() {
    const q = encodeURIComponent(searchInput.value || '');
    const dest = q ? ('/aperionai?q=' + q) : '/aperionai';
    window.location.href = dest;
  }
  
  if (aiToggle) {
    aiToggle.addEventListener('click', navigateToAI);
  }
  
  if (aiTabCheckbox) {
    aiTabCheckbox.addEventListener('click', navigateToAI);
  }
  
  if (aiTabButton) {
    aiTabButton.addEventListener('click', navigateToAI);
  }
})();
</script>
